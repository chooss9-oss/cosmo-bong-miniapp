<body>

<script>
  // === ВСТАВЬ ТОТ ЖЕ КОНФИГ, ЧТО И В ВИДЖЕТЕ НА САЙТЕ ===
  const FIREBASE_CONFIG = {
    apiKey: 'AIzaSyALK5QcbERhpWycM0RYQGKDlwVEgLEKBBg',
    authDomain: 'cosmo-bong-chat-forsite.firebaseapp.com',
    projectId: 'cosmo-bong-chat-forsite',
    storageBucket: 'cosmo-bong-chat-forsite.firebasestorage.app',
    messagingSenderId: '174248020107',
    appId: '1:174248020107:web:9f2542e0d28f13e7ae2c8e'
  };
  const IMGBB_API_KEY = '9491d998fe1a54d89a58da7aeb980c31';

  // Бэкенд cosmo-bong-miniapp — новые эндпоинты для вкладки "Android"
  // (список чатов / история / отправка) поверх существующего Redis-чата,
  // без миграции на Firestore.
  const PANEL_BACKEND_URL = '';
  const PANEL_SECRET = 'k9mP2vXqR7wLtN4hYbJ8sD1fA6cZ3eU0';


  if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === 'ВСТАВЬ_СЮДА') {
    document.getElementById('chat-body').innerHTML =
      '<div id="config-warning">Сначала вставь настройки Firebase в код этой страницы (тот же конфиг, что в виджете на сайте).</div>';
  } else {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();
    const $login = document.getElementById('login-overlay');
    let panelStarted = false;
    firebase.auth().onAuthStateChanged(u => {
      if (u && !u.isAnonymous) {
        $login.style.display = 'none';
        if (!panelStarted) { panelStarted = true; startPanel(); }
      } else {
        $login.style.display = 'flex';
      }
    });
    document.getElementById('login-btn').onclick = () => {
      const em = document.getElementById('login-email').value.trim();
      const pw = document.getElementById('login-pass').value;
      const $err = document.getElementById('login-err');
      $err.textContent = 'Вхожу…';
      firebase.auth().signInWithEmailAndPassword(em, pw)
        .then(() => { $err.textContent = ''; })
        .catch(e => { $err.textContent = 'Не удалось войти: ' + e.message; });
    };
    document.getElementById('login-pass').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
    function startPanel() {

    // Онлайн-счётчик — посетитель считается активным, если "отмечался" в последние 2,5 минуты
    let onlineLoadedOnce = false;
    function refreshOnlineCounter() {
      if (document.hidden) return;
      if (onlineLoadedOnce && $paneOnline && $paneOnline.style.display === 'none') return;
      onlineLoadedOnce = true;
      const threshold = firebase.firestore.Timestamp.fromDate(new Date(Date.now() - 150000));
      db.collection('presence').where('lastSeen', '>', threshold).get()
        .then(snap => {
          document.getElementById('online-count').textContent = snap.size;
          const $ol = document.getElementById('online-list');
          $ol.innerHTML = '';
          const rows = [];
          snap.forEach(doc => rows.push({ id: doc.id, d: doc.data() }));
          rows.sort((a, b) => ((chatMeta[b.id] || {}).at || 0) - ((chatMeta[a.id] || {}).at || 0));
          onlineIds.clear();
          rows.forEach(r => {
            onlineIds.add(r.id);
            if (r.d.visitorLabel) presenceLabels[r.id] = r.d.visitorLabel;
          });
          if (lastChatsSnap) renderChatList(lastChatsSnap);
          rows.forEach(r => {
            const d = r.d;
            const meta = chatMeta[r.id] || {};
                        const dev = d.visitorLabel || chatLabels[r.id] || d.deviceType || 'неизвестно';
            const item = document.createElement('div');
            item.className = 'online-item';
            const av = document.createElement('div');

      if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';

        async function pollAndroidHistory() {
      if (currentMode !== 'android' || !androidActiveCustomerId) return;
      const cid = androidActiveCustomerId;
      try {
        const data = await panelFetch('/api/panel-chat/history?customerId=' + encodeURIComponent(cid));
        if (currentMode !== 'android' || androidActiveCustomerId !== cid) return;
        androidLastReadMs = data.lastReadByCustomerAt || 0;
        const messages = data.messages || [];
                    const keyOf = (m) => m.createdAt + ':' + m.from + ':' + JSON.stringify(m.buttons || '') + ':' + (m.text || '') + ':' + (m.edited ? 1 : 0);

        // Сравниваем с уже отрисованным: если новые сообщения просто
        // добавились в конец (обычный случай), дорисовываем только их,
        // не трогая старые — это и убирает "дёрганье" скролла и повторную
        // загрузку уже показанных картинок/аудио при каждом опросе.
        // Если состав изменился иначе (первое открытие, редактирование,
        // удаление) — перерисовываем всё целиком.
        const isSimpleAppend = messages.length >= androidRenderedKeys.length &&
          androidRenderedKeys.length > 0 &&
          androidRenderedKeys.every((k, i) => k === keyOf(messages[i]));

        if (isSimpleAppend) {
          const newOnes = messages.slice(androidRenderedKeys.length);
          if (newOnes.length) {
            const wasNearBottom = $body.scrollHeight - $body.scrollTop - $body.clientHeight < 80;
            newOnes.forEach(m => {
              $body.appendChild(buildAndroidMsg(m));
              androidRenderedKeys.push(keyOf(m));
            });
            if (wasNearBottom) $body.scrollTop = $body.scrollHeight;
          }
        } else {
          $body.innerHTML = '';
          androidRenderedKeys = [];
          messages.forEach(m => {
            $body.appendChild(buildAndroidMsg(m));
            androidRenderedKeys.push(keyOf(m));
          });
          $body.scrollTop = $body.scrollHeight;
        }
      } catch (e) {
        console.error('android history error', e);
      }
    }

        async function handleOrderActionClick(actionRaw, orderId) {
      // order_accept -> accept, order_paid -> paid, order_shipped -> shipped
      // (сервер сам решает shipped/ready по deliveryMethod заказа),
      // order_ready -> shipped (тот же action, сервер разберётся),
      // order_edit -> edit, order_cancel -> cancel
             const actionMap = {
        order_accept: 'accept',
        order_paid: 'paid',
        order_shipped: 'shipped',
        order_ready: 'shipped',
        order_delivered: 'shipped',
        order_complete: 'complete',
        order_edit: 'edit',
        order_cancel: 'cancel',
        order_calc: 'calc'
      };
           const action = actionMap[actionRaw];
      if (!action || !orderId) return;

      let extra;

      if (action === 'shipped' && actionRaw === 'order_shipped') {
        extra = prompt('Введите трек-номер отправления:');
        if (extra === null) return;
        if (!extra.trim()) { alert('Трек-номер не может быть пустым'); return; }
      }

      if (action === 'edit') {
        extra = prompt(
          'Новый состав и сумма заказа (последней строкой — "Сумма: 1234"):',
          ''
        );
        if (extra === null) return;
      }

           if (action === 'cancel' && !confirm('Точно отменить заказ?')) return;

      try {
        const result = await panelPost('/api/panel-chat/order-action', { orderId, action, extra });
        if (!result.success) {
          alert('Не удалось выполнить действие' + (result.reason ? ' (' + result.reason + ')' : ''));
        }
        await pollAndroidHistory();
      } catch (e) {
        console.error('order action error', e);
        alert('Ошибка при выполнении действия');
      }
    }

    async function sendProductCard(link) {

        const res = await fetch('/api/preview?url=' + encodeURIComponent(link));
        const p = await res.json();
        if (!p || p.error || !p.title) throw new Error(p && p.error ? p.error : 'no data');
        const clean = (s) => String(s || '').replace(/[<>"]/g, '');
        const title = clean(p.title);
        const price = clean(p.price);
        const priceLine = price ? '<br>' + price + ' ₽' : '';
        const msg = {

        db.collection('chats').doc(chatId).set({

          lastActivity: firebase.firestore.FieldValue.serverTimestamp(),

          text: link,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()

    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function toggleMicRecording() {
      if (currentMode !== 'android' || !androidActiveCustomerId) {
        alert('Голосовые сообщения пока доступны только в Android-чате');
        return;
      }

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus'
          : 'audio/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        recordedChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          $micBtn.textContent = '🎤';
          $micBtn.style.background = '';
          const blob = new Blob(recordedChunks, { type: mimeType });
          sendVoiceReply(blob, mimeType.split(';')[0]);
        };

        mediaRecorder.start();
        $micBtn.textContent = '⏹';
        $micBtn.style.background = '#e0724a';
      } catch (e) {
        console.error('mic error', e);
        alert('Не удалось получить доступ к микрофону');
      }
    }

    async function loadStats() {
      const days = parseInt(document.getElementById('stats-period').value, 10) || 7;
      const $sb = document.getElementById('stats-body');
      $sb.innerHTML = '<div class="stats-hint">Загружаю…</div>';
      try {
        const since = firebase.firestore.Timestamp.fromDate(new Date(Date.now() - days * 86400000));
        const snap = await db.collection('analytics').where('createdAt', '>=', since).get();
        const ev = [];
        snap.forEach(d => ev.push(d.data()));
        const uniq = (t) => new Set(ev.filter(e => e.type === t).map(e => e.visitorId).filter(Boolean));
        const visits = uniq('site_visit');
        const opens = uniq('chat_opened');
        const req = uniq('operator_requested');
        const ans = uniq('operator_answered');
               const contacts = uniq('contact_left');
        const ratings = ev.filter(e => e.type === 'rating');
        const good = ratings.filter(e => e.value > 0).length;
        const bad = ratings.filter(e => e.value < 0).length;
        let abandoned = 0;
        req.forEach(id => { if (!ans.has(id) && !contacts.has(id)) abandoned++; });
        const top = (type, field) => {
          const m = {};
          ev.filter(e => e.type === type).forEach(e => {
            const k = e[field] || 'без названия';
            m[k] = (m[k] || 0) + 1;
          });
          return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 5);
        };
        const refs = {};
        ev.filter(e => e.type === 'site_visit').forEach(e => {
          let host = 'прямой заход';
          if (e.referrer) {
            try { host = new URL(e.referrer).hostname; } catch (x) { host = e.referrer; }
          }
          refs[host] = (refs[host] || 0) + 1;
        });
        const topRefs = Object.entries(refs).sort((a, b) => b[1] - a[1]).slice(0, 5);
        const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
        const list = (arr) => arr.length
          ? arr.map(r => '<div class="st-row"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>').join('')
          : '<div class="st-row"><span>нет данных</span></div>';
        $sb.innerHTML =
          '<div class="st-block"><div class="st-title">Воронка</div>' +
            '<div class="st-row"><span>Заходов на сайт</span><b>' + visits.size + '</b></div>' +
            '<div class="st-row"><span>Открыли чат</span><b>' + opens.size + ' (' + pct(opens.size, visits.size) + ')</b></div>' +
            '<div class="st-row"><span>Позвали оператора</span><b>' + req.size + '</b></div>' +
            '<div class="st-row"><span>Получили ответ</span><b>' + ans.size + '</b></div>' +
            '<div class="st-row"><span>Оставили контакт</span><b>' + contacts.size + '</b></div>' +
                        '<div class="st-row"><span>Ушли без ответа</span><b>' + abandoned + '</b></div>' +
            '<div class="st-row"><span>Оценки</span><b>👍 ' + good + ' · 👎 ' + bad + '</b></div>' +
          '</div>' +
          '<div class="st-block"><div class="st-title">Разделы меню</div>' + list(top('menu_click', 'section')) + '</div>' +
          '<div class="st-block"><div class="st-title">Категории товаров</div>' + list(top('category_click', 'category')) + '</div>' +
          '<div class="st-block"><div class="st-title">Источники визитов</div>' + list(topRefs) + '</div>' +
          '<div class="stats-hint">Обработано событий: ' + ev.length + '</div>';
      } catch (e) {
        $sb.innerHTML = '<div class="stats-hint">Ошибка: ' + (e && e.message ? e.message : e) + '</div>';
      }
    }

    async function checkExistingPushSubscription() {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        if (Notification.permission !== 'granted') return;
        const reg = await navigator.serviceWorker.getRegistration('/api/panel/sw.js');
        if (!reg) return;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {

      } catch (e) {

    }

    function urlB64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }
    function bufToB64Url(buf) {
      let bin = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function hashStr(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
      return Math.abs(h).toString(36);
    }

           async function enablePush() {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          alert('Браузер не поддерживает push-уведомления');
          return;
        }
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') { alert('Уведомления запрещены в настройках'); return; }
        const reg = await navigator.serviceWorker.register('/api/panel/sw.js');
        if (!reg.active) {
          await navigator.serviceWorker.ready;
        }
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8Array(VAPID_PUBLIC_KEY)
          });
        }
        
        const id = 'sub_' + hashStr(sub.endpoint);
        await db.collection('push_subscriptions').doc(id).set({
          endpoint: sub.endpoint,
          p256dh: bufToB64Url(sub.getKey('p256dh')),
          auth: bufToB64Url(sub.getKey('auth')),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        $pushBtn.textContent = '✅ Уведомления включены';
      } catch (e) {
        console.error('push error', e);
        alert('Не удалось включить уведомления: ' + e.message);
      }
    }
    $pushBtn.onclick = enablePush;
    }
